<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go Out With Me? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="question-box">
            <h1>Will you go out with me? 💕</h1>
            <p class="subtitle">I promise you'll have a great time...</p>
            
            <div class="button-container">
                <button class="btn yes-btn" id="yesBtn">YES 💖</button>
                <button class="btn no-btn" id="noBtn">NO</button>
            </div>
            
            <div class="success-message" id="successMessage">
                <h2>🎉 YES! 🎉</h2>
                <p>You've made me the happiest! Let's celebrate! 💕✨</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
